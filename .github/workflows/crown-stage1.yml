name: Crown camera and environment review
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/crown-stage1.yml', 'ashen-crown/world-stage1.js', 'ashen-crown/stage1.css']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crown-stage1
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Create isolated preview entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,json
          root=Path('ashen-crown')
          s=(root/'v5.html').read_text()
          pattern=r'(<script type="importmap">)(.*?)(</script>)'
          m=re.search(pattern,s,re.S)
          mappings=json.loads(m.group(2))
          mappings['imports']['./world-v5.js']='./world-stage1.js?v=6.7'
          s=s[:m.start()]+m.group(1)+json.dumps(mappings)+m.group(3)+s[m.end():]
           s=s.replace('</head>','<link rel="stylesheet" href="./stage1.css?v=6.7"></head>')
          s=s.replace("./game-v5.js?v=5.1","./game-v5.js?v=5.2")
          s=s.replace('Build 5.1','Camera and environment study 6.7')
          (root/'stage1.html').write_text(s)
          PY
          node --input-type=module --check < ashen-crown/world-stage1.js
      - name: Install browser for actual WebGL review
        run: |
          mkdir -p /tmp/crown-stage1
          cd /tmp/crown-stage1
          npm init -y
          npm install playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Render preview and validate camera and interaction
        env:
          REVIEW_REPO: ${{ github.workspace }}
        run: |
          cd /tmp/crown-stage1
          cat > review.cjs <<'JS'
          const fs=require('fs'),assert=require('node:assert/strict'),{spawn}=require('node:child_process'),{chromium}=require('playwright');
          async function main(){
            fs.mkdirSync('output',{recursive:true});
            for(const f of ['world-stage1.js','stage1.css','stage1.html'])fs.copyFileSync(process.env.REVIEW_REPO+'/ashen-crown/'+f,'output/'+f);
            const report={scope:'Stage 1 only: fixed camera, full viewport, environment and top HUD. Actual Chromium WebGL/SwiftShader, not physical iPhone performance.',commit:process.env.GITHUB_SHA,views:[],tests:[],errors:[]};
            const server=spawn('python3',['-m','http.server','4173','--bind','127.0.0.1','--directory',process.env.REVIEW_REPO],{stdio:'ignore'});
            await new Promise(r=>setTimeout(r,900));
            const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox']});
            let page;
            try{
              for(const view of [{name:'phone',width:393,height:852},{name:'small-phone',width:360,height:640},{name:'landscape',width:844,height:390},{name:'desktop',width:1440,height:1000}]){
                page=await browser.newPage({viewport:{width:view.width,height:view.height},deviceScaleFactor:1,isMobile:view.width<900,hasTouch:view.width<900});
                page.on('pageerror',e=>report.errors.push(view.name+': '+e.message));
                page.on('console',m=>{if(m.type()==='error')report.errors.push(view.name+': '+m.text());});
                const started=Date.now();
                await page.goto('http://127.0.0.1:4173/ashen-crown/stage1.html?qa=1',{waitUntil:'domcontentloaded',timeout:90000});
                await page.waitForFunction(()=>window.__ASHEN_READY__===true,null,{timeout:30000});
                const readyMs=Date.now()-started;
                const initialEnv=await page.evaluate(()=>window.__ENV_QA__.state());const state=await page.evaluate(()=>window.__ASHEN_QA__.state());
                assert.equal(state.pieces,32);
                report.tests.push(view.name+': first playable frame in '+readyMs+'ms without waiting for HDR/PBR enhancement');
                await page.waitForFunction(()=>{const e=window.__ENV_QA__.state();return e.hdr&&e.stone},null,{timeout:20000});
                await page.waitForTimeout(120);
                const env=await page.evaluate(()=>window.__ENV_QA__.state());
                assert.equal(env.canvas.width,view.width);assert.equal(env.canvas.height,view.height);
                await page.screenshot({path:'output/'+view.name+'.png',timeout:60000});
                const points=await page.evaluate(()=>['a1','h1','a8','h8'].map(s=>window.__ASHEN_QA__.project(s)));
                assert(points.every(p=>p.x>0&&p.x<view.width&&p.y>55&&p.y<view.height));
                const dimensions=await page.evaluate(()=>({w:document.documentElement.scrollWidth,h:document.documentElement.scrollHeight}));assert(dimensions.w<=view.width);assert(dimensions.h<=view.height+1);
                report.views.push({view,readyMs,initialEnv,env,points});report.tests.push(view.name+': loaded HDR and stone; 32 pieces; fullscreen canvas; four corners visible; no overflow');
                if(view.name==='phone'){
                  await page.evaluate(()=>window.__ASHEN_QA__.load('rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',{mode:'local',cinema:'off'}));await page.waitForTimeout(120);const localState=await page.evaluate(()=>window.__ASHEN_QA__.state());const before=localState.camera;
                  await page.mouse.move(180,350);await page.mouse.down();await page.mouse.move(240,480,{steps:5});await page.mouse.up();await page.mouse.wheel(0,220);await page.waitForTimeout(300);
                  assert.deepEqual((await page.evaluate(()=>window.__ASHEN_QA__.state())).camera,before);
                  let p=await page.evaluate(()=>window.__ASHEN_QA__.project('e2'));await page.mouse.click(p.x,p.y);await page.waitForTimeout(300);await page.screenshot({path:'output/phone-selection.png',timeout:60000});
                  const movedOk=await page.evaluate(()=>window.__ASHEN_QA__.move('e2','e4'));assert.equal(movedOk,true);await page.waitForFunction(()=>window.__ASHEN_QA__.state().mode==='play',null,{timeout:15000});
                  const moved=await page.evaluate(()=>window.__ASHEN_QA__.state());assert.notEqual(moved.fen,localState.fen);assert.deepEqual(moved.camera,before);report.tests.push('Real tap selects e2; legal e2-e4 move and drag/wheel leave the camera unchanged');
                  await page.click('#menuBtn');assert(await page.locator('#menuDialog').evaluate(d=>d.open));await page.click('#menuDialog .dismiss');report.tests.push('Top menu opens and closes');
                }
                if(view.name==='desktop'){
                  await page.evaluate(()=>{window.__ENV_QA__.world.orient('b');window.__ASHEN_QA__.render()});
                  await page.screenshot({path:'output/black-side.png',timeout:60000});
                  assert.equal((await page.evaluate(()=>window.__ENV_QA__.state())).orientation,'b');report.tests.push('Black-side orientation retains the environment composition');
                }
                await page.close();page=null;
              }
              assert.equal(report.errors.length,0);report.passed=true;
            }catch(e){report.passed=false;report.errors.push(String(e));if(page)await page.screenshot({path:'output/failure.png',timeout:15000}).catch(()=>{});}
            finally{fs.writeFileSync('output/report.json',JSON.stringify(report,null,2));console.log(JSON.stringify(report,null,2));await browser.close();server.kill();}
            if(!report.passed)process.exitCode=1;
          }
          main().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node review.cjs
      - name: Publish only the tested preview entry point
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ashen-crown/stage1.html
          git diff --cached --quiet || git commit -m 'Publish scoped camera/environment preview without replacing the main game'
          git push origin HEAD:gh-pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-stage1-review
          path: /tmp/crown-stage1/output
          retention-days: 7
