name: Crown iPhone Safari smoke test
on:
  push:
    branches: [gh-pages]
    paths:
      - 'ashen-crown/stage1.html'
      - 'ashen-crown/world-stage1.js'
      - 'ashen-crown/game-v5.js'
      - '.github/workflows/crown-ios-safari.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safari:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install WebKit
        run: |
          mkdir -p /tmp/crown-ios
          cd /tmp/crown-ios
          npm init -y
          npm install playwright@1.56.1 pngjs@7.0.0
          npx playwright install --with-deps webkit
      - name: Test deployed iPhone build
        run: |
          cd /tmp/crown-ios
          cat > ios.cjs <<'JS'
          const fs=require('fs');
          const {webkit,devices}=require('playwright');
          const {PNG}=require('pngjs');
          (async()=>{
            const browser=await webkit.launch();
            const ctx=await browser.newContext({...devices['iPhone 15 Pro'],ignoreHTTPSErrors:true});
            const page=await ctx.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push('PAGEERROR '+e.stack));
            page.on('console',m=>{if(m.type()==='error'||m.type()==='warning')errors.push('CONSOLE '+m.type()+' '+m.text())});
            page.on('requestfailed',r=>errors.push('REQUEST '+r.url()+' '+(r.failure()?.errorText||'')));
            page.on('response',r=>{if(r.status()>=400)errors.push('HTTP '+r.status()+' '+r.url())});
            const url='https://raagulmanoharan.github.io/Train_Wiz/ashen-crown/stage1.html?iosqa='+Date.now();
            let result={url,ready:false,loadingText:null,errors:[]};
            try{
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:90000});
              await page.waitForTimeout(20000);
              result.ready=await page.evaluate(()=>window.__ASHEN_READY__===true);
              result.version=await page.evaluate(()=>document.documentElement.innerHTML.match(/game-v5\\.js\\?v=([\\d.]+)/)?.[1]||null);
              result.errorText=await page.locator('#loadingDetail').textContent().catch(()=>null);
              result.loadingText=await page.locator('#loadingDetail').textContent().catch(()=>null);
              result.body=await page.locator('body').innerText().catch(()=>null);
              result.ua=await page.evaluate(()=>navigator.userAgent);
              result.webgl=await page.evaluate(()=>{
                const c=document.createElement('canvas');
                const gl=c.getContext('webgl2')||c.getContext('webgl');
                return gl?{ok:true,renderer:gl.getParameter(gl.RENDERER),version:gl.getParameter(gl.VERSION)}:{ok:false};
              });
              await page.screenshot({path:'iphone.png',fullPage:true});
              const img=PNG.sync.read(fs.readFileSync('iphone.png'));let bright=0,total=0;
              for(let y=Math.floor(img.height*.24);y<Math.floor(img.height*.82);y+=3)
               for(let x=Math.floor(img.width*.12);x<Math.floor(img.width*.88);x+=3){
                const i=(y*img.width+x)*4;total++;
                if(Math.max(img.data[i],img.data[i+1],img.data[i+2])>48)bright++;
               }
              result.visibleBoardFraction=bright/total;
            }catch(e){errors.push('TEST '+e.stack)}
            result.errors=errors;
            fs.writeFileSync('result.json',JSON.stringify(result,null,2));
            console.log(JSON.stringify(result,null,2));
            await browser.close();
            if(!result.ready||result.visibleBoardFraction<.015)process.exitCode=1;
          })();
          JS
          node ios.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crown-ios-safari
          path: |
            /tmp/crown-ios/result.json
            /tmp/crown-ios/iphone.png
          retention-days: 7
