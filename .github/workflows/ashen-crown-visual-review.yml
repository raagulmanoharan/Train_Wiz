name: Ashen Crown visual review
on:
  push:
    branches: [gh-pages]
    paths: ['.github/workflows/ashen-crown-visual-review.yml', 'ashen-crown/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser review dependencies
        run: |
          mkdir -p /tmp/crown-review
          cd /tmp/crown-review
          npm init -y
          npm install playwright@1.56.1 chess.js@1.4.0 three@0.186.1 || npm install playwright@1.56.1 chess.js@1.4.0 three@0.180.0
          npx playwright install --with-deps chromium
      - name: Capture actual hosted page and collect reproducible assets
        env:
          REVIEW_REPO: ${{ github.workspace }}
        run: |
          cd /tmp/crown-review
          cat > review.cjs <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { chromium } = require('playwright');
          async function main(){
            fs.mkdirSync('output/assets',{recursive:true});
            fs.cpSync('node_modules/three','output/vendor/three',{recursive:true});
            fs.cpSync('node_modules/chess.js','output/vendor/chess.js',{recursive:true});
            fs.copyFileSync(process.env.REVIEW_REPO+'/ashen-crown/index.html','output/deployed-source.html');
            for(const file of ['chess_set.gltf','chess_set.bin']){
              const r=await fetch('https://raw.githubusercontent.com/Mike1934F/3d-chess/main/assets/'+file);
              if(!r.ok)throw Error(file+': '+r.status);
              fs.writeFileSync('output/assets/'+file,Buffer.from(await r.arrayBuffer()));
            }
            const browser=await chromium.launch({args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--no-sandbox']});
            const log=[];
            for(const view of [{name:'mobile',width:393,height:852},{name:'desktop',width:1440,height:1000}]){
              const page=await browser.newPage({viewport:{width:view.width,height:view.height},deviceScaleFactor:1,hasTouch:view.name==='mobile',isMobile:view.name==='mobile'});
              page.on('pageerror',e=>log.push(view.name+' '+e.message));
              page.on('console',e=>{if(e.type()==='error')log.push(view.name+' '+e.text())});
              page.on('response',r=>{if(r.status()>=400)log.push(view.name+' HTTP '+r.status()+' '+r.url())});
              try{
                await page.goto('https://raagulmanoharan.github.io/Train_Wiz/ashen-crown/?review='+Date.now(),{waitUntil:'networkidle',timeout:60000});
                await page.waitForTimeout(12000);
                await page.screenshot({path:'output/'+view.name+'-live.png',fullPage:true});
                fs.writeFileSync('output/'+view.name+'-dom.html',await page.content());
                log.push(view.name+' dimensions '+JSON.stringify(await page.evaluate(()=>({innerWidth,innerHeight,scrollWidth:document.documentElement.scrollWidth,scrollHeight:document.documentElement.scrollHeight}))));
              }catch(e){log.push(view.name+' '+e.message);await page.screenshot({path:'output/'+view.name+'-failure.png',fullPage:true}).catch(()=>{});}
              await page.close();
            }
            await browser.close();
            fs.writeFileSync('output/review-log.json',JSON.stringify(log,null,2));
            console.log(JSON.stringify(log,null,2));
          }
          main().catch(e=>{console.error(e);process.exitCode=1;});
          JS
          node review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ashen-crown-visual-review
          path: /tmp/crown-review/output
          retention-days: 7
